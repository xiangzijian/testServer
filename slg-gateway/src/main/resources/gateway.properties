# Gateway 配置（可用 -Dslg.config=路径 指定外部文件，或 -Dkey=value 覆盖单项）
server.nodeId=1

# ---- 面向客户端 ----
client.host=0.0.0.0
client.port=9001
# 0 = Netty 默认（CPU*2）
client.ioThreads=0
# 客户端超过该秒数无任何上行（含心跳）则断开；客户端建议每 15s 发一次心跳
client.readerIdleSeconds=60
client.maxFrameLength=1048576
client.maxConnections=20000

# ---- 到后端的内部连接 ----
backend.ioThreads=0
backend.heartbeatSeconds=10
backend.connectTimeoutMillis=3000
backend.reconnectMinMillis=1000
backend.reconnectMaxMillis=30000

# ---- 静态服务发现：nodeId@host:port，多个用逗号分隔 ----
discovery.game.nodes=1@127.0.0.1:9201
discovery.world.nodes=1@127.0.0.1:9101
